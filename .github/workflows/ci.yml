name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: main-myapp-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server
    env:
      FRAPPE_REF: v16.18.3
      ERPNEXT_REF: v16.18.3

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init \
            --frappe-branch "${FRAPPE_REF}" \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            ~/frappe-bench
          actual_version="$(~/frappe-bench/env/bin/python -c 'import importlib.metadata as md; print(md.version("frappe"))')"
          expected_version="${FRAPPE_REF#v}"
          if [ "${actual_version}" != "${expected_version}" ]; then
            echo "Expected Frappe ${expected_version}, got ${actual_version}."
            exit 1
          fi

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch "${ERPNEXT_REF}" erpnext https://github.com/frappe/erpnext
          bench get-app myapp $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app myapp
          env/bin/pip check
          bench build
        env:
          CI: 'Yes'

      - name: Run Unit Tests
        working-directory: /home/runner/frappe-bench
        timeout-minutes: 10
        run: |
          env/bin/python -m unittest discover \
            -s apps/myapp/myapp/tests/unit \
            -t . \
            -p "test_*.py"
